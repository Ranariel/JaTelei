name: Build & Deploy JaTelei

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      id-token: write   # exigido pelo SignPath
      actions: read
      contents: read

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Cache NuGet
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: nuget-${{ hashFiles('**/*.csproj') }}
        restore-keys: nuget-

    - name: Setup MSVC environment
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - name: Build C++ Capture DLL
      run: |
        cmake -B JaTelei.Capture/build -S JaTelei.Capture -G "NMake Makefiles" -DCMAKE_BUILD_TYPE=Release
        cmake --build JaTelei.Capture/build

    - name: Set version
      run: echo "VERSION=1.0.${{ github.run_number }}" >> $env:GITHUB_ENV

    - name: Patch AppVersion.cs
      run: |
        (Get-Content JaTelei.Client/AppVersion.cs) -replace '"1\.0\.0"', '"${{ env.VERSION }}"' | Set-Content JaTelei.Client/AppVersion.cs

    - name: Create appsettings.local.json
      run: |
        @"
        {
          "Ice": {
            "TurnUsername": "${{ secrets.TURN_USERNAME }}",
            "TurnCredential": "${{ secrets.TURN_CREDENTIAL }}"
          }
        }
        "@ | Set-Content JaTelei.Client/appsettings.local.json

    - name: Publish .NET app
      run: dotnet publish JaTelei.Client/JaTelei.Client.csproj -c Release -r win-x64 --self-contained true /p:PublishSingleFile=true -o publish

    - name: Copy C++ DLL into publish folder
      run: |
        if (Test-Path "JaTelei.Client/JaTelei.Capture.dll") {
          Copy-Item "JaTelei.Client/JaTelei.Capture.dll" -Destination "publish/"
        }

    - name: Rename exe with version
      run: Rename-Item publish\JaTelei.exe "JaTelei-${{ env.VERSION }}.exe"

    - name: Build Inno Setup installer
      run: |
        & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
          /DMyAppVersion="${{ env.VERSION }}" `
          /DMyExeName="JaTelei-${{ env.VERSION }}.exe" `
          setup\JaTelei.iss

    # ── Upload do instalador sem assinatura ───────────────────────────────────
    - name: Upload installer (unsigned)
      id: upload-unsigned
      uses: actions/upload-artifact@v4
      with:
        name: JaTelei-unsigned
        path: installer/JaTeleiSetup-${{ env.VERSION }}.exe
        retention-days: 1

    # ── Assinar via SignPath Foundation ───────────────────────────────────────
    # Após aprovação em https://signpath.org, preencha as variáveis abaixo
    # no GitHub: Settings → Secrets → Actions → New repository variable:
    #   SIGNPATH_ORGANIZATION_ID  (ex: "a1b2c3d4-...")
    #   SIGNPATH_PROJECT_SLUG     (ex: "jatelei")
    # E adicione o secret:
    #   SIGNPATH_API_TOKEN        (obtido no painel SignPath → API Tokens)
    - name: Sign with SignPath Foundation
      uses: signpath/github-action-submit-signing-request@v2
      with:
        api-token:            '${{ secrets.SIGNPATH_API_TOKEN }}'
        organization-id:      '${{ vars.SIGNPATH_ORGANIZATION_ID }}'
        project-slug:         '${{ vars.SIGNPATH_PROJECT_SLUG }}'
        signing-policy-slug:  'release-signing'
        github-artifact-id:   '${{ steps.upload-unsigned.outputs.artifact-id }}'
        wait-for-completion:  true
        output-artifact-directory: signed-installer

    # ── Upload final (assinado) ───────────────────────────────────────────────
    - name: Upload installer (signed)
      uses: actions/upload-artifact@v4
      with:
        name: JaTelei
        path: signed-installer/JaTeleiSetup-${{ env.VERSION }}.exe
        retention-days: 7
