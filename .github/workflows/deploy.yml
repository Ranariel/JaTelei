name: Build & Deploy JaClipei

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Setup MSVC environment
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - name: Build C++ Capture DLL
      run: |
        cmake -B JaClipei.Capture/build -S JaClipei.Capture -G "NMake Makefiles" -DCMAKE_BUILD_TYPE=Release
        cmake --build JaClipei.Capture/build

    - name: Publish .NET app
      run: dotnet publish JaClipei.Client/JaClipei.Client.csproj -c Release -r win-x64 --self-contained true /p:PublishSingleFile=true -o publish

    - name: Upload to VPS
      shell: powershell
      env:
        SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        VPS_HOST: ${{ secrets.VPS_HOST }}
      run: |
        $keyPath = "$env:TEMP\deploy_key"
        $env:SSH_KEY | Out-File -FilePath $keyPath -Encoding ascii -NoNewline
        icacls $keyPath /inheritance:r /grant:r "${env:USERNAME}:R"
        scp -i $keyPath -o StrictHostKeyChecking=no publish\JaClipei.exe "root@${env:VPS_HOST}:/opt/screenshare/releases/JaClipei-latest.exe"
        Remove-Item $keyPath
