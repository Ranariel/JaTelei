name: Build & Deploy JaClipei

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Setup MSVC environment
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - name: Build C++ Capture DLL
      run: |
        cmake -B JaClipei.Capture/build -S JaClipei.Capture -G "NMake Makefiles" -DCMAKE_BUILD_TYPE=Release
        cmake --build JaClipei.Capture/build

    - name: Publish .NET app
      run: dotnet publish JaClipei.Client/JaClipei.Client.csproj -c Release -r win-x64 --self-contained true /p:PublishSingleFile=true -o publish

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: JaClipei
        path: publish/JaClipei.exe

  deploy:
    needs: build
    runs-on: ubuntu-latest
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
    steps:
    - name: Download artifact
      uses: actions/download-artifact@v4
      with:
        name: JaClipei

    - name: Setup SSH
      run: |
        mkdir -p ~/.ssh
        printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
        chmod 600 ~/.ssh/deploy_key
        ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

    - name: Upload to VPS
      run: scp -i ~/.ssh/deploy_key JaClipei.exe root@"$VPS_HOST":/opt/screenshare/releases/JaClipei-latest.exe
