name: Build & Deploy JaTelei

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Cache NuGet
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: nuget-${{ hashFiles('**/*.csproj') }}
        restore-keys: nuget-

    - name: Setup MSVC environment
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - name: Build C++ Capture DLL
      run: |
        cmake -B JaTelei.Capture/build -S JaTelei.Capture -G "NMake Makefiles" -DCMAKE_BUILD_TYPE=Release
        cmake --build JaTelei.Capture/build

    - name: Download FFmpeg DLLs (GPL shared, win64)
      run: |
        $url = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl-shared.zip"
        Invoke-WebRequest -Uri $url -OutFile ffmpeg.zip
        Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_tmp

        # Find the bin directory (structure may vary between releases)
        $binDir = Get-ChildItem ffmpeg_tmp -Recurse -Directory | Where-Object { $_.Name -eq "bin" } | Select-Object -First 1
        if (-not $binDir) { Write-Error "FFmpeg bin/ not found in zip"; exit 1 }
        Write-Host "FFmpeg bin: $($binDir.FullName)"

        New-Item -ItemType Directory -Force -Path ffmpeg_dlls | Out-Null

        # Copy ALL av*/sw* DLLs with their ORIGINAL VERSIONED names.
        # Do NOT rename them — avcodec-63.dll internally imports "avutil-59.dll" by
        # that exact name, so renaming would break the Windows loader dependency chain.
        Get-ChildItem $binDir.FullName -Filter "*.dll" | Where-Object { $_.Name -match "^(av|sw)" } | ForEach-Object {
          Copy-Item $_.FullName (Join-Path "ffmpeg_dlls" $_.Name)
          Write-Host "Copied $($_.Name)"
        }

        Write-Host "FFmpeg DLLs to be bundled:"
        Get-ChildItem ffmpeg_dlls -Filter "*.dll" | Select-Object Name, @{n='KB';e={[int]($_.Length/1KB)}}

    - name: Set version
      run: echo "VERSION=1.0.${{ github.run_number }}" >> $env:GITHUB_ENV

    - name: Patch AppVersion.cs
      run: |
        (Get-Content JaTelei.Client/AppVersion.cs) -replace '"1\.0\.0"', '"${{ env.VERSION }}"' | Set-Content JaTelei.Client/AppVersion.cs

    - name: Create appsettings.local.json
      run: |
        @"
        {
          "Ice": {
            "TurnUsername": "${{ secrets.TURN_USERNAME }}",
            "TurnCredential": "${{ secrets.TURN_CREDENTIAL }}"
          }
        }
        "@ | Set-Content JaTelei.Client/appsettings.local.json

    - name: Publish .NET app
      run: dotnet publish JaTelei.Client/JaTelei.Client.csproj -c Release -r win-x64 --self-contained true /p:PublishSingleFile=true -o publish

    - name: Copy C++ DLL into publish folder
      run: |
        if (Test-Path "JaTelei.Client/JaTelei.Capture.dll") {
          Copy-Item "JaTelei.Client/JaTelei.Capture.dll" -Destination "publish/"
        }

    - name: Copy FFmpeg DLLs into publish folder
      run: Copy-Item ffmpeg_dlls\*.dll -Destination publish\

    - name: Rename exe with version
      run: Rename-Item publish\JaTelei.exe "JaTelei-${{ env.VERSION }}.exe"

    - name: Build Inno Setup installer
      run: |
        & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
          /DMyAppVersion="${{ env.VERSION }}" `
          /DMyExeName="JaTelei-${{ env.VERSION }}.exe" `
          setup\JaTelei.iss

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ env.VERSION }}
        name: "JaTelei ${{ env.VERSION }}"
        files: installer/JaTeleiSetup-${{ env.VERSION }}.exe
        generate_release_notes: true
