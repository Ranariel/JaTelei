name: Build & Deploy JaTelei

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Cache NuGet
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: nuget-${{ hashFiles('**/*.csproj') }}
        restore-keys: nuget-

    - name: Setup MSVC environment
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - name: Build C++ Capture DLL
      run: |
        cmake -B JaTelei.Capture/build -S JaTelei.Capture -G "NMake Makefiles" -DCMAKE_BUILD_TYPE=Release
        cmake --build JaTelei.Capture/build

    - name: Set version
      id: version
      run: |
        $v = "1.0.${{ github.run_number }}"
        echo "VERSION=$v" >> $env:GITHUB_ENV
        echo "version=$v" >> $env:GITHUB_OUTPUT

    - name: Patch AppVersion.cs
      run: |
        (Get-Content JaTelei.Client/AppVersion.cs) -replace '"1\.0\.0"', '"${{ env.VERSION }}"' | Set-Content JaTelei.Client/AppVersion.cs

    - name: Create appsettings.local.json
      run: |
        @"
        {
          "Ice": {
            "TurnUsername": "${{ secrets.TURN_USERNAME }}",
            "TurnCredential": "${{ secrets.TURN_CREDENTIAL }}"
          }
        }
        "@ | Set-Content JaTelei.Client/appsettings.local.json

    - name: Publish .NET app
      run: dotnet publish JaTelei.Client/JaTelei.Client.csproj -c Release -r win-x64 --self-contained true /p:PublishSingleFile=true -o publish

    - name: Copy C++ DLL into publish folder
      run: |
        if (Test-Path "JaTelei.Client/JaTelei.Capture.dll") {
          Copy-Item "JaTelei.Client/JaTelei.Capture.dll" -Destination "publish/"
        }

    - name: Download FFmpeg (BtbN GPL shared, win64)
      run: |
        # BtbN/FFmpeg-Builds latest — GPL shared build for Windows x64
        $asset = "ffmpeg-master-latest-win64-gpl-shared.zip"
        $url   = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/$asset"
        Write-Host "Downloading $url"
        Invoke-WebRequest -Uri $url -OutFile ffmpeg.zip -UseBasicParsing

        Write-Host "Extracting..."
        Expand-Archive -Path ffmpeg.zip -DestinationPath ffmpeg -Force

        # Folder name inside the zip matches the asset name (minus .zip)
        $binDir = Get-ChildItem ffmpeg -Directory | Select-Object -First 1
        $binDir = Join-Path $binDir.FullName "bin"
        Write-Host "bin dir: $binDir"

        # Copy only the four DLLs the app needs
        foreach ($prefix in @("avcodec", "avutil", "swresample", "swscale")) {
          $dll = Get-ChildItem $binDir -Filter "$prefix-*.dll" | Select-Object -First 1
          if ($dll) {
            Copy-Item $dll.FullName -Destination "publish/" -Force
            Write-Host "  copied $($dll.Name)"
          } else {
            Write-Warning "  $prefix DLL not found in $binDir"
          }
        }

        echo "HAS_FFMPEG=1" >> $env:GITHUB_ENV

    - name: List all DLLs in publish (diagnostic)
      run: |
        Get-ChildItem publish -Filter "*.dll" | ForEach-Object { Write-Host "  $($_.Name)" }

    - name: Rename exe with version
      run: Rename-Item publish\JaTelei.exe "JaTelei-${{ env.VERSION }}.exe"

    - name: Build Inno Setup installer
      run: |
        # Array splat — sem string vazia passada ao ISCC
        $isccArgs = @(
          "/DMyAppVersion=${{ env.VERSION }}",
          "/DMyExeName=JaTelei-${{ env.VERSION }}.exe",
          "setup\JaTelei.iss"
        )
        if ($env:HAS_FFMPEG -eq "1") { $isccArgs = @("/DHasFfmpeg=1") + $isccArgs }
        & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" @isccArgs

    - name: Upload installer artifact
      uses: actions/upload-artifact@v4
      with:
        name: JaTelei
        path: installer/JaTeleiSetup-${{ env.VERSION }}.exe
        retention-days: 7

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ env.VERSION }}
        name: JaTelei v${{ env.VERSION }}
        files: installer/JaTeleiSetup-${{ env.VERSION }}.exe
        generate_release_notes: false
        body: |
          Versão ${{ env.VERSION }} — build automático.
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
    - name: Trigger VPS deploy via webhook
      run: |
        curl -sf -X POST https://jaclipei.com/deploy-hook \
          -H "Authorization: Bearer ${{ secrets.DEPLOY_WEBHOOK_SECRET }}" \
          -H "Content-Type: application/json" \
          -d '{"version":"${{ needs.build.outputs.version }}"}'
