name: Build & Deploy JaTelei

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Cache NuGet
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: nuget-${{ hashFiles('**/*.csproj') }}
        restore-keys: nuget-

    - name: Setup MSVC environment
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - name: Build C++ Capture DLL
      run: |
        cmake -B JaTelei.Capture/build -S JaTelei.Capture -G "NMake Makefiles" -DCMAKE_BUILD_TYPE=Release
        cmake --build JaTelei.Capture/build

    - name: Set version
      id: version
      run: |
        $v = "1.0.${{ github.run_number }}"
        echo "VERSION=$v" >> $env:GITHUB_ENV
        echo "version=$v" >> $env:GITHUB_OUTPUT

    - name: Patch AppVersion.cs
      run: |
        (Get-Content JaTelei.Client/AppVersion.cs) -replace '"1\.0\.0"', '"${{ env.VERSION }}"' | Set-Content JaTelei.Client/AppVersion.cs

    - name: Create appsettings.local.json
      run: |
        @"
        {
          "Ice": {
            "TurnUsername": "${{ secrets.TURN_USERNAME }}",
            "TurnCredential": "${{ secrets.TURN_CREDENTIAL }}"
          }
        }
        "@ | Set-Content JaTelei.Client/appsettings.local.json

    - name: Publish .NET app
      run: dotnet publish JaTelei.Client/JaTelei.Client.csproj -c Release -r win-x64 --self-contained true /p:PublishSingleFile=true -o publish

    - name: Copy C++ DLL into publish folder
      run: |
        if (Test-Path "JaTelei.Client/JaTelei.Capture.dll") {
          Copy-Item "JaTelei.Client/JaTelei.Capture.dll" -Destination "publish/"
        }

    - name: Copy FFmpeg DLLs into publish folder
      id: ffmpeg
      run: |
        $dest = "publish"
        $copied = 0

        # 1) Build output — primary source when dotnet build extracted them
        Get-ChildItem "JaTelei.Client" -Recurse -ErrorAction SilentlyContinue |
          Where-Object { $_.Name -match "^(av|sw).+\.dll$" } |
          ForEach-Object {
            Copy-Item $_.FullName -Destination $dest -Force
            Write-Host "bin: $($_.Name)"
            $copied++
          }

        # 2) Full NuGet cache — any win-x64 subfolder in any package
        Get-ChildItem "$env:USERPROFILE\.nuget\packages" -Recurse -ErrorAction SilentlyContinue |
          Where-Object { $_.Name -match "^(av|sw).+\.dll$" -and $_.FullName -match "win.?x64|win64" } |
          ForEach-Object {
            Copy-Item $_.FullName -Destination $dest -Force
            Write-Host "nuget: $($_.Name)  [$($_.DirectoryName)]"
            $copied++
          }

        Write-Host "FFmpeg DLLs copied: $copied"
        if ($copied -gt 0) {
          echo "HAS_FFMPEG=1" >> $env:GITHUB_ENV
        } else {
          Write-Host "WARNING: No FFmpeg DLLs found — installer will ship without them"
        }

    - name: List all DLLs in publish (diagnostic)
      run: |
        Get-ChildItem publish -Filter "*.dll" | ForEach-Object { Write-Host "  $($_.Name)" }

    - name: Rename exe with version
      run: Rename-Item publish\JaTelei.exe "JaTelei-${{ env.VERSION }}.exe"

    - name: Build Inno Setup installer
      run: |
        # Use array splat so no empty string is ever passed to ISCC
        $isccArgs = @(
          "/DMyAppVersion=${{ env.VERSION }}",
          "/DMyExeName=JaTelei-${{ env.VERSION }}.exe",
          "setup\JaTelei.iss"
        )
        if ($env:HAS_FFMPEG -eq "1") { $isccArgs = @("/DHasFfmpeg=1") + $isccArgs }
        & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" @isccArgs

    - name: Upload installer artifact
      uses: actions/upload-artifact@v4
      with:
        name: JaTelei
        path: installer/JaTeleiSetup-${{ env.VERSION }}.exe
        retention-days: 7

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ env.VERSION }}
        name: JaTelei v${{ env.VERSION }}
        files: installer/JaTeleiSetup-${{ env.VERSION }}.exe
        generate_release_notes: false
        body: |
          Versão ${{ env.VERSION }} — build automático.
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
    - name: Trigger VPS deploy
      uses: appleboy/ssh-action@v1
      with:
        host: ${{ secrets.VPS_HOST }}
        username: root
        key: ${{ secrets.VPS_DEPLOY_KEY }}
        script: /opt/screenshare/deploy.sh --version ${{ needs.build.outputs.version }}
