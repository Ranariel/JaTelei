name: Build & Deploy JaTelei

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Cache NuGet
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: nuget-${{ hashFiles('**/*.csproj') }}
        restore-keys: nuget-

    - name: Setup MSVC environment
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - name: Build C++ Capture DLL
      run: |
        cmake -B JaTelei.Capture/build -S JaTelei.Capture -G "NMake Makefiles" -DCMAKE_BUILD_TYPE=Release
        cmake --build JaTelei.Capture/build

    - name: Set version
      id: version
      run: |
        $v = "1.0.${{ github.run_number }}"
        echo "VERSION=$v" >> $env:GITHUB_ENV
        echo "version=$v" >> $env:GITHUB_OUTPUT

    - name: Patch AppVersion.cs
      run: |
        (Get-Content JaTelei.Client/AppVersion.cs) -replace '"1\.0\.0"', '"${{ env.VERSION }}"' | Set-Content JaTelei.Client/AppVersion.cs

    - name: Create appsettings.local.json
      run: |
        @"
        {
          "Ice": {
            "TurnUsername": "${{ secrets.TURN_USERNAME }}",
            "TurnCredential": "${{ secrets.TURN_CREDENTIAL }}"
          }
        }
        "@ | Set-Content JaTelei.Client/appsettings.local.json

    - name: Publish .NET app
      run: dotnet publish JaTelei.Client/JaTelei.Client.csproj -c Release -r win-x64 --self-contained true /p:PublishSingleFile=true -o publish

    - name: Copy C++ DLL into publish folder
      run: |
        if (Test-Path "JaTelei.Client/JaTelei.Capture.dll") {
          Copy-Item "JaTelei.Client/JaTelei.Capture.dll" -Destination "publish/"
        }

    - name: Copy FFmpeg DLLs from NuGet cache
      run: |
        $nuget = "$env:USERPROFILE\.nuget\packages"
        # SIPSorceryMedia.Windows stores FFmpeg in runtimes/win-x64/native
        $sipsPkg = Get-ChildItem "$nuget\sipsorcerymedia.windows" -ErrorAction SilentlyContinue |
                   Sort-Object Name -Descending | Select-Object -First 1
        if ($sipsPkg) {
          $native = Join-Path $sipsPkg.FullName "runtimes\win-x64\native"
          if (Test-Path $native) {
            Get-ChildItem $native -Filter "*.dll" | ForEach-Object {
              Copy-Item $_.FullName -Destination "publish\" -Force
              Write-Host "Copied FFmpeg DLL: $($_.Name)"
            }
          } else {
            Write-Host "Native path not found: $native"
          }
        } else {
          Write-Host "SIPSorceryMedia.Windows package not found in NuGet cache"
        }
        # Also check avcodec/avutil directly in case they land under a different package
        @("ffmpeg.autogen", "sipsorcery") | ForEach-Object {
          $pkg = Get-ChildItem "$nuget\$_" -ErrorAction SilentlyContinue |
                 Sort-Object Name -Descending | Select-Object -First 1
          if ($pkg) {
            Get-ChildItem $pkg.FullName -Recurse -Filter "av*.dll" -ErrorAction SilentlyContinue |
              Where-Object { $_.DirectoryName -match "win-x64" } | ForEach-Object {
                Copy-Item $_.FullName -Destination "publish\" -Force
                Write-Host "Copied: $($_.Name) from $_"
              }
            Get-ChildItem $pkg.FullName -Recurse -Filter "sw*.dll" -ErrorAction SilentlyContinue |
              Where-Object { $_.DirectoryName -match "win-x64" } | ForEach-Object {
                Copy-Item $_.FullName -Destination "publish\" -Force
                Write-Host "Copied: $($_.Name) from $_"
              }
          }
        }

    - name: List FFmpeg DLLs in publish (diagnostic)
      run: |
        Write-Host "All DLLs in publish:"
        Get-ChildItem publish -Filter "*.dll" | ForEach-Object { Write-Host "  $($_.Name)" }

    - name: Rename exe with version
      run: Rename-Item publish\JaTelei.exe "JaTelei-${{ env.VERSION }}.exe"

    - name: Build Inno Setup installer
      run: |
        & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
          /DMyAppVersion="${{ env.VERSION }}" `
          /DMyExeName="JaTelei-${{ env.VERSION }}.exe" `
          setup\JaTelei.iss

    - name: Upload installer artifact
      uses: actions/upload-artifact@v4
      with:
        name: JaTelei
        path: installer/JaTeleiSetup-${{ env.VERSION }}.exe
        retention-days: 7

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ env.VERSION }}
        name: JaTelei v${{ env.VERSION }}
        files: installer/JaTeleiSetup-${{ env.VERSION }}.exe
        generate_release_notes: false
        body: |
          Versão ${{ env.VERSION }} — build automático.
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
    - name: Trigger VPS deploy
      uses: appleboy/ssh-action@v1
      with:
        host: ${{ secrets.VPS_HOST }}
        username: root
        key: ${{ secrets.VPS_DEPLOY_KEY }}
        script: /opt/screenshare/deploy.sh --version ${{ needs.build.outputs.version }}
