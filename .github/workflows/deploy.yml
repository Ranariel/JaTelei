name: Build & Deploy JaClipei

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'
    - name: Setup MSVC environment
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64
    - name: Build C++ Capture DLL
      run: |
        cmake -B JaClipei.Capture/build -S JaClipei.Capture -G "NMake Makefiles" -DCMAKE_BUILD_TYPE=Release
        cmake --build JaClipei.Capture/build
    - name: Set version
      run: echo "VERSION=1.0.${{ github.run_number }}" >> $env:GITHUB_ENV
    - name: Patch AppVersion.cs
      run: |
        (Get-Content JaClipei.Client/AppVersion.cs) -replace '"1\.0\.0"', '"${{ env.VERSION }}"' | Set-Content JaClipei.Client/AppVersion.cs
    - name: Publish .NET app
      run: dotnet publish JaClipei.Client/JaClipei.Client.csproj -c Release -r win-x64 --self-contained true /p:PublishSingleFile=true -o publish
    - name: Rename exe with version
      run: Rename-Item publish\JaClipei.exe "JaClipei-${{ env.VERSION }}.exe"
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: JaClipei
        path: publish/JaClipei-${{ env.VERSION }}.exe

  deploy:
    needs: build
    runs-on: ubuntu-latest
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VERSION: 1.0.${{ github.run_number }}
    steps:
    - name: Download artifact
      uses: actions/download-artifact@v4
      with:
        name: JaClipei
    - name: Setup SSH
      run: |
        mkdir -p ~/.ssh
        printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
        chmod 600 ~/.ssh/deploy_key
        ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts
    - name: Upload to VPS
      run: |
        scp -i ~/.ssh/deploy_key "JaClipei-${VERSION}.exe" root@"$VPS_HOST":/opt/screenshare/releases/
    - name: Remove old releases (keep last 3)
      run: |
        ssh -i ~/.ssh/deploy_key root@"$VPS_HOST" \
          "ls -t /opt/screenshare/releases/JaClipei-1.*.exe 2>/dev/null | tail -n +4 | xargs rm -f"
    - name: Update latest version on VPS
      run: |
        ssh -i ~/.ssh/deploy_key root@"$VPS_HOST" \
          "echo ${VERSION} > /opt/screenshare/latest_version.txt"
